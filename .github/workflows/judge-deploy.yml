name: judge-deploy

on:
  push:
    branches: [main]
    paths:
      - judge/**
      - .github/workflows/judge-deploy.yml
  workflow_dispatch:

concurrency:
  group: judge-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: judge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo 'StrictHostKeyChecking accept-new' > ~/.ssh/config

      - name: Copy judge/ to the server
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude cache \
            --exclude serviceAccountKey.json \
            --exclude test \
            judge/ "$TARGET:/opt/nnhs-prog-club-judge/"

      - name: Install and configure
        run: |
          ssh "$TARGET" 'bash -se' <<'EOF'
          set -euo pipefail
          name=nnhs-prog-club-judge
          cd /opt/$name
          npm ci --omit=dev
          id -u $name >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin $name
          sudo install -d /etc/$name
          sudo install -d -o $name /var/cache/$name
          sudo install -m 644 deploy/api.env /etc/$name/api.env
          EOF

      - name: Upload the Firebase key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" | ssh "$TARGET" '
            set -e
            key=/etc/nnhs-prog-club-judge/serviceAccountKey.json
            sudo sh -c "umask 077 && cat > $key"
            sudo chown nnhs-prog-club-judge: $key'

      - name: Restart and check
        run: |
          ssh "$TARGET" 'bash -se' <<'EOF'
          set -euo pipefail
          sudo systemctl restart nnhs-prog-club-judge-api
          curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/healthz
          EOF
